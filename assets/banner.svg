<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Simeet Nayan</title>
  <desc id="desc">Software engineer at Wells Fargo and Software Engineering Specialist at xAI. Open source and machine learning after hours.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#10182B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="78%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#A371F7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B2A44" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)" opacity="0.45"/>
  <rect width="1600" height="420" fill="url(#orb)"/>
  <rect x="0" y="0" width="6" height="420" fill="url(#accent)"/>

  <!-- neural graph -->
  <g opacity="0.95" fill="none" stroke-linecap="round">
    <path d="M1080 78 L1200 148 L1328 104 L1460 176" stroke="#58A6FF" stroke-width="1.6" opacity="0.65"/>
    <path d="M1060 214 L1200 148 L1244 268 L1388 242" stroke="#A371F7" stroke-width="1.6" opacity="0.6"/>
    <path d="M1110 332 L1244 268 L1328 104 L1418 72" stroke="#3FB950" stroke-width="1.3" opacity="0.4"/>
    <path d="M1200 148 L1320 208 L1472 128" stroke="#8B949E" stroke-width="1.1" opacity="0.4"/>
    <circle cx="1080" cy="78" r="5.5" fill="#58A6FF"/>
    <circle cx="1200" cy="148" r="8" fill="#A371F7"/>
    <circle cx="1328" cy="104" r="5.5" fill="#58A6FF"/>
    <circle cx="1460" cy="176" r="5" fill="#3FB950"/>
    <circle cx="1060" cy="214" r="4.5" fill="#8B949E"/>
    <circle cx="1244" cy="268" r="6.5" fill="#58A6FF"/>
    <circle cx="1388" cy="242" r="5" fill="#A371F7"/>
    <circle cx="1110" cy="332" r="4.5" fill="#3FB950"/>
    <circle cx="1418" cy="72" r="4" fill="#58A6FF"/>
    <circle cx="1320" cy="208" r="4.5" fill="#8B949E"/>
    <circle cx="1472" cy="128" r="4" fill="#A371F7"/>
    <circle cx="1200" cy="148" r="18" fill="#A371F7" opacity="0.14">
      <animate attributeName="r" values="16;24;16" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.06;0.2" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- copy -->
  <text x="72" y="118" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">SOFTWARE · OPEN SOURCE · MACHINE LEARNING</text>
  <text x="70" y="198" fill="#E6EDF3" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="2">Simeet Nayan</text>
  <rect x="72" y="222" width="280" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="272" fill="#C9D1D9" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Software engineer. Open source and machine learning.</text>

  <!-- status chips -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="308" width="168" height="40" rx="20" fill="#111B2E" stroke="#233554"/>
    <circle cx="94" cy="328" r="5" fill="#3FB950"/>
    <text x="110" y="333" fill="#E6EDF3">Wells Fargo</text>

    <rect x="252" y="308" width="100" height="40" rx="20" fill="#111B2E" stroke="#233554"/>
    <text x="274" y="333" fill="#C9D1D9">xAI</text>

    <rect x="364" y="308" width="176" height="40" rx="20" fill="#111B2E" stroke="#233554"/>
    <text x="386" y="333" fill="#C9D1D9">IIEST Shibpur '24</text>

    <rect x="552" y="308" width="118" height="40" rx="20" fill="#111B2E" stroke="#233554"/>
    <text x="574" y="333" fill="#C9D1D9">IEEE</text>
  </g>
</svg>
